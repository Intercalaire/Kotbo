name: Prepare Voice Captcha

# Prepare le captcha vocal sans rien executer en local : regenere les lockfiles
# apres l'ajout des dependances vocales, produit le pack audio, et commite le
# tout sur la branche choisie. A lancer une seule fois depuis l'onglet Actions.
on:
  workflow_dispatch:
    inputs:
      regenerate_pack:
        description: "Regenerer le pack audio (decocher si seuls les lockfiles doivent bouger)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    name: Lockfiles et pack audio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # L'image de production installe depuis package.bot.json et bun.bot.lock,
      # un jeu de dependances distinct de celui de la racine. Les deux lockfiles
      # doivent donc etre regeneres, sans quoi le build Docker echoue sur
      # --frozen-lockfile.
      - name: Regenerer bun.bot.lock
        run: |
          cp package.json /tmp/package.root.json
          cp bun.lock /tmp/bun.root.lock

          cp package.bot.json package.json
          cp bun.bot.lock bun.lock
          bun install
          cp bun.lock bun.bot.lock

          cp /tmp/package.root.json package.json
          cp /tmp/bun.root.lock bun.lock

      - name: Regenerer bun.lock
        run: bun install

      - name: Installer edge-tts
        if: inputs.regenerate_pack
        run: pipx install edge-tts

      - name: Verifier ffmpeg
        if: inputs.regenerate_pack
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Generer les packs audio
        if: inputs.regenerate_pack
        run: |
          ./scripts/generate-captcha-voice.sh
          ./scripts/generate-captcha-voice-en.sh

      # Les packs alimentent le captcha vocal : un pack incomplet ferait basculer
      # silencieusement tous les serveurs sur le captcha image en production.
      - name: Verifier la completude des packs
        if: inputs.regenerate_pack
        run: |
          check_pack() {
            script="$1"
            dir="$2"
            for symbol in $(grep -oE '\[[A-Z0-9]\]="' "$script" | tr -d '[]="'); do
              if ! ls "${dir}/${symbol}-"*.ogg > /dev/null 2>&1; then
                echo "Clip manquant pour le symbole $symbol dans $dir"
                exit 1
              fi
            done
            echo "$(grep -oE '\[[A-Z0-9]\]="' "$script" | wc -l) symboles couverts dans $dir."
          }
          check_pack scripts/generate-captcha-voice.sh apps/bot/assets/captcha-voice/fr
          check_pack scripts/generate-captcha-voice-en.sh apps/bot/assets/captcha-voice/en

      - name: Commiter le resultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lock bun.bot.lock apps/bot/assets/captcha-voice
          if git diff --cached --quiet; then
            echo "Rien a commiter." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore(captcha): regenerer les lockfiles et le pack audio vocal"
          git push origin HEAD:"${GITHUB_REF_NAME}"
